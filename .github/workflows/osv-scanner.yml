name: OSV-Scanner

# Scans lockfiles (uv.lock, package-lock.json) against the OSV vulnerability
# database. Runs on every PR/push (via the ci.yml orchestrator's workflow_call)
# and on a weekly schedule against main.
#
# OSV-Scanner does not modify pins. Its JSON output is reviewed fail closed:
# only the exact documented no-patch braces and development/optional sprintf-js
# findings may pass. A separate focused WhatsApp production audit is clean and
# blocking. Our full-SHA / exact-version pinning strategy is preserved.
#
# Complements the supply-chain-audit.yml workflow (which scans for malicious
# code patterns in PR diffs) by covering the orthogonal "currently-pinned
# dep became known-vulnerable" case.
#
# Uses Google's officially-recommended reusable workflow, pinned by SHA.
# Findings land in the repo's Security tab (Code Scanning > OSV-Scanner).
# fail-on-vuln is disabled only because the exact finding policy below decides
# whether the two reviewed no-patch advisories are acceptable. Unknown,
# patchable, malformed, missing, and extra findings fail that policy job.
#
# The reusable workflow exports its complete scanner JSON to a wrapper job,
# which validates advisory provenance and emits review_status.

on:
  workflow_call:
  schedule:
    # Weekly scan against main — catches CVEs published after merge for
    # deps that haven't changed since.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
  actions: read
  contents: read
  security-events: write

jobs:
  whatsapp-production-audit:
    name: Audit WhatsApp production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/whatsapp-bridge/package-lock.json

      - name: Enforce clean production audit and exact patched lock
        run: npm --prefix scripts/whatsapp-bridge run audit:prod

  scan:
    name: Scan lockfiles
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      # Scan explicit lockfiles rather than recursing, so we only look at
      # the five sources of truth and skip vendored / test / worktree dirs.
      scan-args: |-
        --lockfile=uv.lock
        --lockfile=package-lock.json
        --lockfile=website/package-lock.json
        --lockfile=plugins/platforms/photon/sidecar/package-lock.json
        --lockfile=scripts/whatsapp-bridge/package-lock.json
      # The upstream reusable workflow uploads this SARIF file to code scanning;
      # export-results separately carries its full JSON into the policy job.
      results-file-name: osv-results.sarif
      fail-on-vuln: false
      export-results: true

  review-findings:
    name: Review OSV findings
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    outputs:
      review_status: ${{ steps.emit.outputs.review_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review findings and emit review_status
        id: emit
        env:
          OSV_RESULTS: ${{ needs.scan.outputs.results }}
          SCAN_RESULT: ${{ needs.scan.result }}
          RESULTS_PATH: ${{ runner.temp }}/osv-results.json
        run: |
          set -euo pipefail
          printf '%s' "$OSV_RESULTS" > "$RESULTS_PATH"
          python3 scripts/ci/osv_review_status.py \
            --scan-result "$SCAN_RESULT" \
            --results "$RESULTS_PATH" \
            --status-file review-status.json

      - name: Upload review status artifact
        if: always() && steps.emit.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-status-osv-scanner
          path: review-status.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

  required-dependency-gates:
    name: Require WhatsApp and OSV dependency gates
    needs: [whatsapp-production-audit, scan, review-findings]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout aggregate evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/evaluate_required_jobs.py
          sparse-checkout-cone-mode: false

      - name: Fail unless every dependency gate succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/ci/evaluate_required_jobs.py
          --strict
          --required-job whatsapp-production-audit
          --required-job scan
          --required-job review-findings
          --needs-json "$NEEDS"
