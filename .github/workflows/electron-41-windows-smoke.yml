name: Temporary Electron 41 Windows validation

on:
  pull_request:
    paths:
      - .github/workflows/electron-41-windows-smoke.yml

permissions:
  contents: read

jobs:
  windows-install:
    name: Windows npm install and Electron launch
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - name: Use npm 12
        shell: bash
        run: npm --version | grep -q '^12\.' || npm install --global npm@12
      - name: Install exact lockfile with scripts
        run: npm ci
      - name: Verify release pins and install-script policy
        run: npm exec -- vitest run tests-js/allow-scripts-sync.test.ts apps/desktop/electron/desktop-electron-pin.test.ts --reporter=verbose
      - name: Verify Electron binary
        shell: bash
        run: |
          test -f node_modules/electron/dist/electron.exe
          version="$(node node_modules/electron/cli.js --version)"
          test "$version" = "v41.10.3"
